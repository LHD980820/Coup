name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 순수 Kotlin 엔진/AI/런타임 (독립 빌드, docs/adr/0001)
      - name: Core tests and coverage gate
        working-directory: core
        run: ./gradlew test koverVerify

      - name: Upload core test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/*/build/reports/tests/

      - name: Unit tests and lint
        run: ./gradlew test lint

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html

  # Firebase 어댑터(:data)를 실제 Firestore·Auth 에뮬레이터 + firestore.rules 위에서 돌린다(docs/adr/0009).
  # 에뮬레이터(firebase-tools)는 Java 21, Gradle 빌드는 Java 17로 실행한다.
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Firebase CLI
        working-directory: firebase/rules-test
        run: npm install

      - name: Firebase adapter tests on the emulator
        working-directory: firebase/rules-test
        env:
          COUP_REQUIRE_EMULATOR: "true"
        run: npx firebase --config ../firebase.json emulators:exec --only firestore,auth --project demo-coup "cd ../.. && JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew :data:testDebugUnitTest"

      - name: Server judge function tests on the emulator
        working-directory: firebase/rules-test
        env:
          COUP_REQUIRE_EMULATOR: "true"
        run: npx firebase --config ../firebase.json emulators:exec --only firestore --project demo-coup "cd ../../server && JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew test shadowJar"

      - name: Upload adapter test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-test-reports
          path: |
            data/build/reports/tests/
            server/build/reports/tests/
